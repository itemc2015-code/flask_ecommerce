tags:
  - Admin
security:
  - Bearer: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "name"
        password:
          type: string
          example: "password"
responses:
  200:
    description: Password updated successfully
  400:
    description: Invalid input
  401:
    description: Token missing or invalid
  403:
    description: No permission
  404:
    description: Username not found